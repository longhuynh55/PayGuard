[project]
name = "payguard-simulator"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.0",
    "lightgbm>=4.7.0",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
