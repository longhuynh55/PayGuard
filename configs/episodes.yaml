schema_version: 1

seed:
  value: 20261026
  unit: integer seed
  rationale: Separate reproducibility default for episode-level randomization.
  provenance:
    kind: assumption
    reference: P1.1 implementation default; episode seed derivation is implemented in P1.7.

protocol:
  duration_days:
    value: 30
    unit: days after T0
    rationale: Episode future duration.
    provenance:
      kind: contract
      reference: docs/data.md, section 4.
  minimum_incidents:
    value: 0
    unit: incident scenarios per episode
    rationale: Clean episodes have no injected incident.
    provenance:
      kind: contract
      reference: docs/data.md, section 4.
  maximum_incidents:
    value: 2
    unit: incident scenarios per episode
    rationale: The MVP permits at most two simultaneous scenario components per episode.
    provenance:
      kind: contract
      reference: docs/data.md, section 4.

templates:
  data_pipeline:
    mode:
      value: multiply_100
      unit: pipeline fault mode
      rationale: Round-one smoke uses the contracted amount unit-change fault.
      provenance:
        kind: contract
        reference: docs/data.md, section 4.
  seasonal:
    date_offset_days:
      value: 4
      unit: local calendar days after T0
      rationale: Place the one-day public seasonal event inside every 30-day episode.
      provenance:
        kind: assumption
        reference: P1.7 smoke injection schedule; no real calendar event is claimed.
    event_name:
      value: "Synthetic promotion event"
      unit: public business-calendar description
      rationale: Publish a neutral event description with the expected transaction-count effect.
      provenance:
        kind: assumption
        reference: P1.7 smoke calendar description.
    additional_transaction_count:
      value: 20
      unit: valid transactions
      rationale: Add observable one-day traffic at smoke scale.
      provenance:
        kind: assumption
        reference: P1.7 smoke seasonal template; not a prevalence estimate.
    expected_relative_change:
      value: 5.0
      unit: relative change
      rationale: Declare an assumed large one-day count increase for the smoke fixture.
      provenance:
        kind: assumption
        reference: P1.7 smoke seasonal template; not estimated from episode truth.
  fraud_surge:
    date_offset_days:
      value: 4
      unit: local calendar days after T0
      rationale: Keep the known card-testing surge inside the first episode week.
      provenance:
        kind: assumption
        reference: P1.7 round-two template schedule.
  fraud_calendar:
    date_offset_days:
      value: 4
      unit: local calendar days after T0
      rationale: Align the fraud-only calendar context with the seasonal template date.
      provenance:
        kind: assumption
        reference: P1.7 round-two template schedule; calendar parameters come from seasonal.
  new_merchant_sparse_history:
    date_offset_days:
      value: 12
      unit: local calendar days after T0
      rationale: Place the sparse merchant after the shared control-account history window.
      provenance:
        kind: assumption
        reference: P1.7 round-two template schedule.
    transaction_count:
      value: 3
      unit: valid merchant transactions
      rationale: Use a small sparse-merchant sample within the injector's supported range.
      provenance:
        kind: assumption
        reference: P1.6 sparse-new-merchant injector bounds; P1.7 pilot fixture choice.
  silent_concept_drift:
    date_offset_days:
      value: 18
      unit: local calendar days after T0
      rationale: Place the silent-drift sample in the latter half of the episode window.
      provenance:
        kind: assumption
        reference: P1.7 round-two template schedule.
    transaction_count:
      value: 10
      unit: valid transactions
      rationale: Keep a small, fixed sample of ordinary-looking fraud transactions.
      provenance:
        kind: assumption
        reference: P1.6 silent-concept-drift injector; P1.7 pilot fixture choice.
  legitimate_new_account_controls:
    accounts_per_episode:
      value: 2
      unit: accounts per episode
      rationale: Add an early and an in-window legitimate account to every episode, including clean.
      provenance:
        kind: assumption
        reference: P1.7 N7 user decision 01/11/2026; minimal fixture count.
    additional_accounts_without_social_engineering:
      value: 1
      unit: ordinary accounts per episode without a social-engineering mule
      rationale: Keep the observable post-T0 customer count equal across episodes; new_fraud already has its mule.
      provenance:
        kind: assumption
        reference: P1.7 review r2 F1' episode-count parity.
    creation_offset_days:
      value: 0
      unit: local calendar days after T0 for the early control
      rationale: Seeded seconds after T0 make the early legitimate account available before the new_fraud effect window; this offset is applied in every template and is never replaced with a mule timestamp.
      provenance:
        kind: assumption
        reference: P1.7 N7 review r2 N8; account timestamp is seeded per episode.
    creation_in_window_offset_days:
      value: 9
      unit: local calendar days after T0 for the in-window control
      rationale: Place a legitimate account inside the new_fraud effect window and before its decision deadline.
      provenance:
        kind: assumption
        reference: P1.7 N7 review r1 F1; new_fraud deadline is day 15.
    creation_in_window_jitter_days:
      value: 3
      unit: seeded whole calendar days
      rationale: Vary the in-window creation date while retaining at least the required seven-day history before the day-27 first payment.
      provenance:
        kind: assumption
        reference: P1.7 N7 review r1 F1; P2.2 seven-day observation window.
    creation_time_jitter_seconds:
      value: 86399
      unit: seeded seconds after local midnight
      rationale: Ensure each control is created strictly after its selected local calendar day begins.
      provenance:
        kind: assumption
        reference: P1.7 N7 review r1 F1; as-of comparison uses strict event time after T0.
    early_first_transaction_offset_days:
      value: 15
      unit: local calendar days after T0 for the early control
      rationale: Provide ordinary legitimate activity by the day-15 deadline, after the seven-day feature lookback; spread first activity from the day-8 timing-matched account.
      provenance:
        kind: assumption
        reference: P1.7 review r2 F1' transaction-level as-of check.
    early_transactions_per_account:
      value: 1
      unit: ordinary merchant transactions per early control account
      rationale: Provide a visible legitimate transaction before the new_fraud decision deadline.
      provenance:
        kind: assumption
        reference: P1.7 review r2 F1' transaction-level as-of check.
    first_transaction_offset_days:
      value: 27
      unit: local calendar days after T0
      rationale: Start activity for the later-created account after the configured seven-day observation window.
      provenance:
        kind: assumption
        reference: P2.2 customer observation flags use a seven-day history window.
    transactions_per_account:
      value: 3
      unit: valid merchant transactions per in-window control account
      rationale: Give the later-created account a few ordinary payments before the episode ends.
      provenance:
        kind: assumption
        reference: P1.7 N7 control-account schedule.
    timing_match_transactions_per_account:
      value: 1
      unit: ordinary merchant transactions for the timing-match account
      rationale: Keep the first-activity schedule matched to the social-engineering mule without copying its identity or creation timestamp.
      provenance:
        kind: assumption
        reference: P1.7 review r2 F1' episode-count parity.
    minimum_account_age_days:
      value: 7
      unit: days before the first control transaction
      rationale: Satisfy the longest P2.2 feature observation window before monitoring includes the transaction.
      provenance:
        kind: contract
        reference: model/features.py FEATURE_LOOKBACK_DAYS; docs/evaluation.md section 2.

profiles:
  smoke:
    role_episode_counts:
      development:
        value: 1
        unit: episodes
        rationale: Keep one development episode in the five-episode round-one smoke manifest.
        provenance:
          kind: assumption
          reference: P1.7 round-one smoke allocation; roles follow docs/evaluation.md.
      calibration:
        value: 2
        unit: episodes
        rationale: Keep two calibration episodes in the five-episode round-one smoke manifest.
        provenance:
          kind: assumption
          reference: P1.7 round-one smoke allocation; roles follow docs/evaluation.md.
      test:
        value: 2
        unit: episodes
        rationale: Keep two test episodes in the five-episode round-one smoke manifest.
        provenance:
          kind: assumption
          reference: P1.7 round-one smoke allocation; roles follow docs/evaluation.md.
    clean_episode_counts:
      development:
        value: 1
        unit: clean episodes
        rationale: Include one episode with no P1.6 incident injection.
        provenance:
          kind: assumption
          reference: P1.7 round-one smoke coverage.
      calibration:
        value: 0
        unit: clean episodes
        rationale: Use both calibration episodes to cover the two incident templates.
        provenance:
          kind: assumption
          reference: P1.7 round-one smoke coverage.
      test:
        value: 0
        unit: clean episodes
        rationale: Use both test episodes to repeat the two incident templates on held-out seeds.
        provenance:
          kind: assumption
          reference: P1.7 round-one smoke coverage.
    multi_cause_episode_count:
      value: 0
      unit: episodes
      rationale: Round-one smoke limits every episode to zero or one incident.
      provenance:
        kind: assumption
        reference: docs/p1-implementation.md, P1.7 round-one scope.
    assignments:
      - episode_id: ep-0001
        role: development
        template: clean
      - episode_id: ep-0002
        role: calibration
        template: data_pipeline
      - episode_id: ep-0003
        role: calibration
        template: seasonal
      - episode_id: ep-0004
        role: test
        template: data_pipeline
      - episode_id: ep-0005
        role: test
        template: seasonal
  pilot:
    role_episode_counts:
      development:
        value: 12
        unit: episodes
        rationale: Pilot episode allocation by evaluation role.
        provenance:
          kind: contract
          reference: docs/evaluation.md, section 1.
      calibration:
        value: 24
        unit: episodes
        rationale: Pilot episode allocation by evaluation role.
        provenance:
          kind: contract
          reference: docs/evaluation.md, section 1.
      test:
        value: 24
        unit: episodes
        rationale: Pilot episode allocation by evaluation role.
        provenance:
          kind: contract
          reference: docs/evaluation.md, section 1.
    clean_episode_counts:
      development:
        value: 4
        unit: clean episodes
        rationale: Pilot clean episode allocation by evaluation role.
        provenance:
          kind: contract
          reference: docs/evaluation.md, section 1.
      calibration:
        value: 8
        unit: clean episodes
        rationale: Pilot clean episode allocation by evaluation role.
        provenance:
          kind: contract
          reference: docs/evaluation.md, section 1.
      test:
        value: 8
        unit: clean episodes
        rationale: Pilot clean episode allocation by evaluation role.
        provenance:
          kind: contract
          reference: docs/evaluation.md, section 1.
    multi_cause_episode_count:
      value: 10
