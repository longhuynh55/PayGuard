schema_version: 1

seed:
  value: 20261026
  unit: integer seed
  rationale: Separate reproducibility default for episode-level randomization.
  provenance:
    kind: assumption
    reference: P1.1 implementation default; episode seed derivation is implemented in P1.7.

protocol:
  duration_days:
    value: 30
    unit: days after T0
    rationale: Episode future duration.
    provenance:
      kind: contract
      reference: docs/data.md, section 4.
  minimum_incidents:
    value: 0
    unit: incident scenarios per episode
    rationale: Clean episodes have no injected incident.
    provenance:
      kind: contract
      reference: docs/data.md, section 4.
  maximum_incidents:
    value: 2
    unit: incident scenarios per episode
    rationale: The MVP permits at most two simultaneous scenario components per episode.
    provenance:
      kind: contract
      reference: docs/data.md, section 4.

profiles:
  smoke:
    role_episode_counts:
      development:
        value: 3
        unit: episodes
        rationale: Smoke retains all split roles at one quarter of pilot scale.
        provenance:
          kind: assumption
          reference: P1.1 smoke profile scale; role proportions follow docs/evaluation.md.
      calibration:
        value: 6
        unit: episodes
        rationale: Smoke retains all split roles at one quarter of pilot scale.
        provenance:
          kind: assumption
          reference: P1.1 smoke profile scale; role proportions follow docs/evaluation.md.
      test:
        value: 6
        unit: episodes
        rationale: Smoke retains all split roles at one quarter of pilot scale.
        provenance:
          kind: assumption
          reference: P1.1 smoke profile scale; role proportions follow docs/evaluation.md.
    clean_episode_counts:
      development:
        value: 1
        unit: clean episodes
        rationale: Retain the pilot clean share in the smoke profile.
        provenance:
          kind: assumption
          reference: P1.1 smoke profile scale; role proportions follow docs/evaluation.md.
      calibration:
        value: 2
        unit: clean episodes
        rationale: Retain the pilot clean share in the smoke profile.
        provenance:
          kind: assumption
          reference: P1.1 smoke profile scale; role proportions follow docs/evaluation.md.
      test:
        value: 2
        unit: clean episodes
        rationale: Retain the pilot clean share in the smoke profile.
        provenance:
          kind: assumption
          reference: P1.1 smoke profile scale; role proportions follow docs/evaluation.md.
    multi_cause_episode_count:
      value: 1
      unit: episodes
      rationale: Preserve the pilot rate of multi-cause episodes at smoke scale.
      provenance:
        kind: assumption
        reference: P1.1 smoke profile scale; ratio follows docs/data.md.
  pilot:
    role_episode_counts:
      development:
        value: 12
        unit: episodes
        rationale: Pilot episode allocation by evaluation role.
        provenance:
          kind: contract
          reference: docs/evaluation.md, section 1.
      calibration:
        value: 24
        unit: episodes
        rationale: Pilot episode allocation by evaluation role.
        provenance:
          kind: contract
          reference: docs/evaluation.md, section 1.
      test:
        value: 24
        unit: episodes
        rationale: Pilot episode allocation by evaluation role.
        provenance:
          kind: contract
          reference: docs/evaluation.md, section 1.
    clean_episode_counts:
      development:
        value: 4
        unit: clean episodes
        rationale: Pilot clean episode allocation by evaluation role.
        provenance:
          kind: contract
          reference: docs/evaluation.md, section 1.
      calibration:
        value: 8
        unit: clean episodes
        rationale: Pilot clean episode allocation by evaluation role.
        provenance:
          kind: contract
          reference: docs/evaluation.md, section 1.
      test:
        value: 8
        unit: clean episodes
        rationale: Pilot clean episode allocation by evaluation role.
        provenance:
          kind: contract
          reference: docs/evaluation.md, section 1.
    multi_cause_episode_count:
      value: 4
      unit: episodes
      rationale: Pilot multi-cause episode count.
      provenance:
        kind: contract
        reference: docs/data.md, section 4.
