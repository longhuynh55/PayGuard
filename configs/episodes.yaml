schema_version: 1

seed:
  value: 20261026
  unit: integer seed
  rationale: Separate reproducibility default for episode-level randomization.
  provenance:
    kind: assumption
    reference: P1.1 implementation default; episode seed derivation is implemented in P1.7.

protocol:
  duration_days:
    value: 30
    unit: days after T0
    rationale: Episode future duration.
    provenance:
      kind: contract
      reference: docs/data.md, section 4.
  minimum_incidents:
    value: 0
    unit: incident scenarios per episode
    rationale: Clean episodes have no injected incident.
    provenance:
      kind: contract
      reference: docs/data.md, section 4.
  maximum_incidents:
    value: 2
    unit: incident scenarios per episode
    rationale: The MVP permits at most two simultaneous scenario components per episode.
    provenance:
      kind: contract
      reference: docs/data.md, section 4.

templates:
  data_pipeline:
    mode:
      value: multiply_100
      unit: pipeline fault mode
      rationale: Round-one smoke uses the contracted amount unit-change fault.
      provenance:
        kind: contract
        reference: docs/data.md, section 4.
  seasonal:
    date_offset_days:
      value: 4
      unit: local calendar days after T0
      rationale: Place the one-day public seasonal event inside every 30-day episode.
      provenance:
        kind: assumption
        reference: P1.7 smoke injection schedule; no real calendar event is claimed.
    event_name:
      value: "Synthetic promotion event"
      unit: public business-calendar description
      rationale: Publish a neutral event description with the expected transaction-count effect.
      provenance:
        kind: assumption
        reference: P1.7 smoke calendar description.
    additional_transaction_count:
      value: 20
      unit: valid transactions
      rationale: Add observable one-day traffic at smoke scale.
      provenance:
        kind: assumption
        reference: P1.7 smoke seasonal template; not a prevalence estimate.
    expected_relative_change:
      value: 5.0
      unit: relative change
      rationale: Declare an assumed large one-day count increase for the smoke fixture.
      provenance:
        kind: assumption
        reference: P1.7 smoke seasonal template; not estimated from episode truth.

profiles:
  smoke:
    role_episode_counts:
      development:
        value: 1
        unit: episodes
        rationale: Keep one development episode in the five-episode round-one smoke manifest.
        provenance:
          kind: assumption
          reference: P1.7 round-one smoke allocation; roles follow docs/evaluation.md.
      calibration:
        value: 2
        unit: episodes
        rationale: Keep two calibration episodes in the five-episode round-one smoke manifest.
        provenance:
          kind: assumption
          reference: P1.7 round-one smoke allocation; roles follow docs/evaluation.md.
      test:
        value: 2
        unit: episodes
        rationale: Keep two test episodes in the five-episode round-one smoke manifest.
        provenance:
          kind: assumption
          reference: P1.7 round-one smoke allocation; roles follow docs/evaluation.md.
    clean_episode_counts:
      development:
        value: 1
        unit: clean episodes
        rationale: Include one episode with no P1.6 incident injection.
        provenance:
          kind: assumption
          reference: P1.7 round-one smoke coverage.
      calibration:
        value: 0
        unit: clean episodes
        rationale: Use both calibration episodes to cover the two incident templates.
        provenance:
          kind: assumption
          reference: P1.7 round-one smoke coverage.
      test:
        value: 0
        unit: clean episodes
        rationale: Use both test episodes to repeat the two incident templates on held-out seeds.
        provenance:
          kind: assumption
          reference: P1.7 round-one smoke coverage.
    multi_cause_episode_count:
      value: 0
      unit: episodes
      rationale: Round-one smoke limits every episode to zero or one incident.
      provenance:
        kind: assumption
        reference: docs/p1-implementation.md, P1.7 round-one scope.
    assignments:
      - episode_id: ep-0001
        role: development
        template: clean
      - episode_id: ep-0002
        role: calibration
        template: data_pipeline
      - episode_id: ep-0003
        role: calibration
        template: seasonal
      - episode_id: ep-0004
        role: test
        template: data_pipeline
      - episode_id: ep-0005
        role: test
        template: seasonal
  pilot:
    role_episode_counts:
      development:
        value: 12
        unit: episodes
        rationale: Pilot episode allocation by evaluation role.
        provenance:
          kind: contract
          reference: docs/evaluation.md, section 1.
      calibration:
        value: 24
        unit: episodes
        rationale: Pilot episode allocation by evaluation role.
        provenance:
          kind: contract
          reference: docs/evaluation.md, section 1.
      test:
        value: 24
        unit: episodes
        rationale: Pilot episode allocation by evaluation role.
        provenance:
          kind: contract
          reference: docs/evaluation.md, section 1.
    clean_episode_counts:
      development:
        value: 4
        unit: clean episodes
        rationale: Pilot clean episode allocation by evaluation role.
        provenance:
          kind: contract
          reference: docs/evaluation.md, section 1.
      calibration:
        value: 8
        unit: clean episodes
        rationale: Pilot clean episode allocation by evaluation role.
        provenance:
          kind: contract
          reference: docs/evaluation.md, section 1.
      test:
        value: 8
        unit: clean episodes
        rationale: Pilot clean episode allocation by evaluation role.
        provenance:
          kind: contract
          reference: docs/evaluation.md, section 1.
    multi_cause_episode_count:
      value: 4
      unit: episodes
      rationale: Pilot multi-cause episode count.
      provenance:
        kind: contract
        reference: docs/data.md, section 4.
    assignments: []
