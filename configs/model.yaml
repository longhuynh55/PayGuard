schema_version: 1

# Split dates are local business dates, with inclusive starts and exclusive ends.
business_timezone: Asia/Ho_Chi_Minh
boundary_convention: start_inclusive_end_exclusive
provenance:
  kind: contract
  reference: docs/model.md, section 1.

splits:
  fit:
    start_inclusive: "2025-07-01"
    end_exclusive: "2025-09-22"
  validation:
    start_inclusive: "2025-09-22"
    end_exclusive: "2025-10-01"
  calibration:
    start_inclusive: "2025-10-01"
    end_exclusive: "2025-11-01"

training:
  model_version: payguard-lgbm-isotonic-round1
  seed: 42
  early_stopping_rounds: 20
  imbalance_strategy: scale_pos_weight
  provenance: "default, untuned"
  lightgbm:
    n_estimators: 100
    learning_rate: 0.1
    num_leaves: 31
    max_depth: -1
    min_child_samples: 20
    subsample: 1.0
    colsample_bytree: 1.0
    reg_alpha: 0.0
    reg_lambda: 0.0
    deterministic: true
    force_col_wise: true
    n_jobs: 1
    verbosity: -1

calibration:
  method: isotonic
  fallback_method: sigmoid
  minimum_support: 25
  support_basis: each_class
  provenance: "assumption, untuned"

conformal:
  alpha_legit: 0.005
  alpha_fraud: 0.20
  provenance: "bản 24/10, giả định cần đo lại trên split mới, chưa tune"
