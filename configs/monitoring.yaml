schema_version: 1

reference:
  start_business_date:
    value: "2025-11-01"
    unit: inclusive local business date
    rationale: Fixed reference start for round-one feature PSI.
    provenance:
      kind: contract
      reference: docs/monitoring.md, section 1; docs/model.md, section 1.
  end_business_date_exclusive:
    value: "2026-02-01"
    unit: exclusive local business date
    rationale: Fixed reference covers November 2025 through January 2026.
    provenance:
      kind: contract
      reference: docs/monitoring.md, section 1; docs/model.md, section 1.
  as_of_business_date:
    value: "2026-02-01"
    unit: local business date at start of day
    rationale: Freeze reference availability at T0 so late data cannot revise the baseline.
    provenance:
      kind: contract
      reference: docs/data.md, section 2; docs/model.md, section 1.

window_days:
  value: 7
  unit: inclusive local business dates
  rationale: Monitoring window length in the locked MVP contract.
  provenance:
    kind: contract
    reference: docs/monitoring.md, section 1.

metric_windows:
  psi.txn_count_24h:
    value: 7
    unit: inclusive local business dates
    rationale: PSI uses the locked seven-day monitoring window.
    provenance:
      kind: contract
      reference: docs/monitoring.md, section 1; docs/evaluation.md, section 2.
  psi.amount_avg_7d:
    value: 7
    unit: inclusive local business dates
    rationale: PSI uses the locked seven-day monitoring window.
    provenance:
      kind: contract
      reference: docs/monitoring.md, section 1; docs/evaluation.md, section 2.
  volume.txn_count:
    value: 1
    unit: inclusive local business dates
    rationale: The daily volume metric observes exactly one business date.
    provenance:
      kind: contract
      reference: docs/monitoring.md, section 1; docs/evaluation.md, section 2.

minimum_sample_count:
  value: 30
  unit: observations
  rationale: Initial support floor; mark small samples instead of treating them as reliable.
  provenance:
    kind: assumption
    reference: Assumption, not tuned; no benchmark result is claimed.

psi:
  number_of_bins:
    value: 2
    unit: quantile bins
    rationale: Two broad reference quantile bins keep the seven-day PSI estimate supported by its small transaction window.
    provenance:
      kind: source
      reference: docs/monitoring.md, section 1; P3.7 clean-development calibration.
  epsilon:
    value: 1.0
    unit: count pseudocount per bin
    rationale: Add one count per PSI bin so an empty seven-day bin does not dominate the estimate.
    provenance:
      kind: source
      reference: docs/monitoring.md, section 1; P3.7 clean-development calibration.

features:
  - metric_id: psi.txn_count_24h
    feature: txn_count_24h
  - metric_id: psi.amount_avg_7d
    feature: amount_avg_7d

daily_volume:
  metric_id: volume.txn_count
  feature: txn_count

model_review_rate:
  metric_id: model.review_rate
  feature: decision_region

signals:
  profiles:
    smoke:
      psi_threshold:
        value: 0.25
        unit: PSI
        rationale: Retain the round-one PSI operating point after correcting sparse-window binning; clean development stays below the existing smoke background-alert budget.
        provenance:
          kind: source
          reference: docs/monitoring.md, section 1; P3.7 clean-development calibration.
      volume_relative_change_threshold:
        value: 4.25
        unit: absolute relative change
        rationale: Strictly exceed the maximum absolute one-day deviation from the public calendar expectation across the 30 clean development snapshots after the phase-independent median reference baseline.
        provenance:
          kind: source
          reference: docs/monitoring.md, section 1; maximum absolute delivered one-day residual over clean development episode ep-0001 (30 dates) after reference_median_1d_count; 4.25.
    pilot:
      psi_threshold:
        value: 0.01
        unit: PSI
        rationale: Smallest value on the 0.01 grid at or above the exact maximum 2-bin PSI over 192 complete-window clean development snapshots (96 per feature for psi.txn_count_24h and psi.amount_avg_7d, episodes ep-0001 to ep-0004), exact max 0.009764810255898246 (psi.amount_avg_7d, ep-0002, 2026-02-26); alerts use strict comparison, so no in-sample clean snapshot alerts.
        provenance:
          kind: source
          reference: docs/monitoring.md, section 1; docs/p3-implementation.md, MON-RECAL handoff (pilot clean development calibration on ep-0001 to ep-0004).
      volume_relative_change_threshold:
        value: 0.21
        unit: absolute relative change
        rationale: Smallest value on the 0.01 grid at or above the exact maximum absolute one-day deviation from the public calendar expectation over 120 clean development snapshots (ep-0001 to ep-0004, 30 dates each) after the reference_median_1d_count baseline, exact max 0.20114942528735624 (ep-0002, 2026-02-13); alerts use strict comparison, so no in-sample clean snapshot alerts.
        provenance:
          kind: source
          reference: docs/monitoring.md, section 1; docs/p3-implementation.md, MON-RECAL handoff (pilot clean development calibration on ep-0001 to ep-0004).
