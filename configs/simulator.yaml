schema_version: 1

# This seed is a reproducibility default, separate from the behavior parameters
# and profile sizes below. Run manifests will record any override.
seed:
  value: 20261025
  unit: integer seed
  rationale: Fixed default for deterministic simulator runs; not a tuned benchmark parameter.
  provenance:
    kind: assumption
    reference: P1.1 implementation default; no external source claims this seed.

episode:
  duration_days:
    value: 30
    unit: calendar days
    rationale: Public episode horizon consumed by monitoring and checked against the episode protocol.
    provenance:
      kind: contract
      reference: docs/p3-implementation.md, P3.6.

timeline:
  storage_timezone:
    value: UTC
    unit: IANA timezone
    rationale: Normalize persisted timestamps to one timezone.
    provenance:
      kind: user_decision
      reference: User decision for P1.1 on 2026-10-26.
  business_timezone:
    value: Asia/Ho_Chi_Minh
    unit: IANA timezone
    rationale: Resolve business dates and local schedules in Vietnam time.
    provenance:
      kind: user_decision
      reference: User decision for P1.1 on 2026-10-26.
  start_business_date:
    value: "2025-07-01"
    unit: local business date
    rationale: Start of the declared base simulation period.
    provenance:
      kind: contract
      reference: docs/data.md, section 1.
  end_business_date_exclusive:
    value: "2026-07-01"
    unit: local business date
    rationale: Exclusive end boundary for the declared July 2025 through June 2026 period.
    provenance:
      kind: contract
      reference: docs/data.md, section 1.
  t0_business_date:
    value: "2026-02-01"
    unit: local business date
    rationale: Split between shared history and episode futures.
    provenance:
      kind: contract
      reference: docs/data.md, sections 1 and 4.
  drift_start_business_date:
    value: "2026-04-01"
    unit: local business date
    rationale: Declared start of background drift in the demo timeline.
    provenance:
      kind: contract
      reference: docs/data.md, section 1.
  monitoring_job_time_local:
    value: "00:00"
    unit: local wall-clock time
    rationale: Explicit default execution time for a daily monitoring job; replace only through a versioned config decision.
    provenance:
      kind: assumption
      reference: Simulator schedule assumption; docs/data.md fixes the local calendar timezone, not the execution hour.
  salary_days_of_month:
    value: [10, 25]
    unit: day of month in Asia/Ho_Chi_Minh
    rationale: Configurable representative paydays; these dates are synthetic assumptions, not market measurements.
    provenance:
      kind: assumption
      reference: Simulator calendar assumption; no external source is claimed.
  promotion_month_day:
    value: "11-11"
    unit: month-day in Asia/Ho_Chi_Minh
    rationale: Keep the 11/11 promotion date in the local business calendar.
    provenance:
      kind: contract
      reference: docs/data.md, section 1.

world:
  expected_transactions_per_customer_local_day:
    value: 0.15
    unit: transactions per customer per local calendar day
    rationale: Mean of a Poisson daily transaction count; low-volume synthetic baseline for the initial profile.
    provenance:
      kind: assumption
      reference: Simulator scale assumption; no external dataset estimate is claimed.
  minimum_customer_count:
    value: 1
    unit: customers
    rationale: Smallest valid generated world.
    provenance:
      kind: assumption
      reference: Simulator validity constraint.
  minimum_merchant_count:
    value: 1
    unit: merchants
    rationale: Smallest valid generated world.
    provenance:
      kind: assumption
      reference: Simulator validity constraint.
  account_role_weights:
    value: {individual: 0.75, household_business: 0.20, internal_mule: 0.05}
    unit: account share by role
    rationale: Synthetic role mix sized to represent all three world roles in smoke; not a population estimate.
    provenance:
      kind: assumption
      reference: P1.3 round 2 world construction; no market proportions are claimed.
  familiar_account_payee_count:
    value: 2
    unit: familiar account payees per individual
    rationale: Small synthetic contact set for repeat A2A payments.
    provenance:
      kind: assumption
      reference: P1.3 round 2 world construction; no observed contact-list size is claimed.
  household_supplier_merchant_count:
    value: 2
    unit: supplier merchants per household-business account
    rationale: Small synthetic supplier set for repeat household-business payments.
    provenance:
      kind: assumption
      reference: P1.3 round 2 world construction; no observed supplier count is claimed.
  internal_mule_outbound_window_hours:
    value: 4
    unit: hours
    rationale: Synthetic capability window for the later P1.4 mule behavior; P1.3 emits no mule cash-out chain.
    provenance:
      kind: assumption
      reference: P1.3 round 2 world capability; no timing estimate is claimed.
  legitimate_device_change_probability:
    value: 0.03
    unit: probability per transaction
    rationale: Synthetic chance that a legitimate account uses a previously unseen device token on a transaction; a new device alone is not fraud truth.
    provenance:
      kind: assumption
      reference: P1.4 background control for legitimate device changes; no population rate is claimed.
  customer_segments:
    value: [retail]
    unit: segment codes
    rationale: Round 1 uses one neutral customer segment; additional account roles are deferred.
    provenance:
      kind: assumption
      reference: P1.3 round 1 baseline profile; no population proportions are claimed.
  customer_provinces:
    value: [HCM, HN]
    unit: province codes
    rationale: Uniform synthetic choice from the two locations used by the current fixture.
    provenance:
      kind: assumption
      reference: P1.3 round 1 baseline profile; no market share is claimed.
  customer_age_bands:
    value: [18-24, 25-34, 35-44, 45-54, 55+]
    unit: age-band codes
    rationale: Uniform synthetic age-band choice for generated customer profiles.
    provenance:
      kind: assumption
      reference: P1.3 round 1 baseline profile; no population proportions are claimed.
  merchant_mcc_codes:
    value: ["5411", "5812"]
    unit: MCC text codes
    rationale: Uniform synthetic choice of MCC using codes already present in the P1.2 fixture.
    provenance:
      kind: assumption
      reference: P1.3 round 1 baseline profile; no merchant-category proportions are claimed.
  merchant_provinces:
    value: [HCM, HN]
    unit: province codes
    rationale: Uniform synthetic choice from the two locations used by the current fixture.
    provenance:
      kind: assumption
      reference: P1.3 round 1 baseline profile; no market share is claimed.

transactions:
  minimum_amount:
    value: 1000
    unit: integer VND
    rationale: Inclusive lower bound for uniform integer VND amount sampling.
    provenance:
      kind: assumption
      reference: Simulator amount-range assumption; no external distribution is claimed.
  maximum_amount:
    value: 100000000
    unit: integer VND
    rationale: Inclusive upper bound for uniform integer VND amount sampling.
    provenance:
      kind: assumption
      reference: Simulator amount-range assumption; no external distribution is claimed.
  channel:
    value: qr
    unit: channel code
    rationale: Default channel selected by single-channel background calendar injections.
    provenance:
      kind: assumption
      reference: Synthetic P1.6 injection assumption; no channel mix is claimed.
  channel_weights:
    value: {qr: 0.50, wallet: 0.30, card: 0.20}
    unit: transaction probability by channel
    rationale: Synthetic channel mix with positive representation for QR, wallet, and card; not a market-share estimate.
    provenance:
      kind: assumption
      reference: P1.3 round 2 simulator mix; no source-backed market proportions are claimed.
  account_transfer_channel:
    value: wallet
    unit: channel code
    rationale: Route synthetic account-to-account transfers through the wallet channel.
    provenance:
      kind: assumption
      reference: P1.3 round 2 A2A representation; no product-specific routing is claimed.
  account_transfer_rate_per_individual_local_day:
    value: 0.03
    unit: A2A transfers per individual per local calendar day
    rationale: Low-volume synthetic contact transfers that create an observable but sparse background flow.
    provenance:
      kind: assumption
      reference: P1.3 round 2 simulator scale; no market transaction rate is claimed.
  refund_probability:
    value: 0.01
    unit: probability in [0, 1]
    rationale: Synthetic chance that an eligible transaction receives one later refund event.
    provenance:
      kind: assumption
      reference: P1.3 round 2 lifecycle assumption; not an empirical rate.
  reversal_probability:
    value: 0.005
    unit: probability in [0, 1]
    rationale: Synthetic chance that an eligible transaction receives one later reversal event, exclusive of refund.
    provenance:
      kind: assumption
      reference: P1.3 round 2 lifecycle assumption; not an empirical rate.
  adjustment_minimum_delay_minutes:
    value: 15
    unit: minutes after settlement
    rationale: Keep any refund or reversal event after the original transaction and settlement.
    provenance:
      kind: assumption
      reference: P1.3 round 2 lifecycle timing; no processor delay is claimed.
  adjustment_maximum_delay_hours:
    value: 48
    unit: hours after settlement
    rationale: Upper bound for synthetic refund/reversal event timing.
    provenance:
      kind: assumption
      reference: P1.3 round 2 lifecycle timing; no processor delay is claimed.
  authorization_response_code:
    value: "00"
    unit: response code
    rationale: One generic approval code for the successful baseline lifecycle.
    provenance:
      kind: assumption
      reference: P1.3 round 1 response assumption; no processor-specific mapping is claimed.
  authorization_delay_seconds:
    value: 1
    unit: seconds after transaction creation
    rationale: Keep the authorization lifecycle event distinct from transaction creation.
    provenance:
      kind: assumption
      reference: P1.3 round 1 lifecycle timing assumption.
  hourly_transaction_weights:
    value: [0.08, 0.08, 0.08, 0.08, 0.08, 0.08, 0.15, 0.15, 0.4, 0.7, 0.9, 1.2, 1.3, 1.1, 0.8, 0.8, 1.0, 1.2, 1.3, 1.2, 0.9, 0.6, 0.3, 0.15]
    unit: relative weight per local clock hour
    rationale: Select a local transaction hour by relative weight, then sample minute and second uniformly.
    provenance:
      kind: assumption
      reference: P1.3 round 1 schedule assumption; no source-backed hourly distribution is claimed.
  settlement_delay_minutes:
    value: 10
    unit: minutes after authorization
    rationale: Short synthetic delay so lifecycle events are temporally distinct from creation.
    provenance:
      kind: assumption
      reference: P1.3 round 1 lifecycle assumption; no processor-specific latency is claimed.

fraud:
  card_testing:
    channel:
      value: card
      unit: channel code
      rationale: Card-testing attempts use the existing transaction channel field with the card code.
      provenance:
        kind: assumption
        reference: P1.4 round 1 scope; channel code selected for this simulator mechanism.
    campaign_interval_days:
      value: 7
      unit: local calendar days between card-testing campaigns
      rationale: One campaign every seven local calendar dates distributes smoke fraud examples across generated base history and episode futures; this is not a benchmark prevalence estimate.
      provenance:
        kind: assumption
        reference: P1.4 round 1 support assumption; no population rate is claimed.
    start_hour_local:
      value: 9
      unit: local wall-clock hour in Asia/Ho_Chi_Minh
      rationale: Fixed synthetic start time for the card-testing attempt window.
      provenance:
        kind: assumption
        reference: P1.4 simulator schedule assumption; no time-of-day estimate is claimed.
    benign_control_delay_minutes:
      value: 120
      unit: minutes after card-testing start
      rationale: Places the benign small-transaction control later on the same business date.
      provenance:
        kind: assumption
        reference: P1.4 simulator schedule assumption; no time-of-day estimate is claimed.
    approval_probability:
      value: 0.05
      unit: probability in [0, 1]
      rationale: Assumed low approval rate for repeated card-testing attempts.
      provenance:
        kind: assumption
        reference: Simulator mechanism assumption; not an empirical estimate.
    followup_approval_probability:
      value: 0.8
      unit: probability in [0, 1]
      rationale: Assumed approval chance for the larger transaction after small card checks.
      provenance:
        kind: assumption
        reference: P1.4 simulator mechanism assumption; not an empirical estimate.
    attempts_per_card:
      value: 8
      unit: attempts per tested card
      rationale: Small repeated-attempt pattern for the MVP card-testing mechanism.
      provenance:
        kind: assumption
        reference: Simulator mechanism assumption; not an empirical estimate.
    window_minutes:
      value: 10
      unit: minutes
      rationale: Assumed short window used to group repeated attempts.
      provenance:
        kind: assumption
        reference: Simulator mechanism assumption; not an empirical estimate.
    minimum_attempt_amount:
      value: 1000
      unit: integer VND
      rationale: Inclusive lower bound for small card-testing attempts.
      provenance:
        kind: assumption
        reference: P1.4 simulator mechanism assumption; no transaction amount distribution is claimed.
    maximum_attempt_amount:
      value: 10000
      unit: integer VND
      rationale: Inclusive upper bound for small card-testing attempts.
      provenance:
        kind: assumption
        reference: P1.4 simulator mechanism assumption; no transaction amount distribution is claimed.
    minimum_followup_amount:
      value: 100000
      unit: integer VND
      rationale: Inclusive lower bound for the larger transaction following the small attempts.
      provenance:
        kind: assumption
        reference: P1.4 simulator mechanism assumption; no transaction amount distribution is claimed.
    maximum_followup_amount:
      value: 5000000
      unit: integer VND
      rationale: Inclusive upper bound for the larger transaction following the small attempts.
      provenance:
        kind: assumption
        reference: P1.4 simulator mechanism assumption; no transaction amount distribution is claimed.
    followup_delay_seconds:
      value: 60
      unit: seconds after the attempt window
      rationale: Leaves a short observable gap between the dense small attempts and the larger follow-up.
      provenance:
        kind: assumption
        reference: P1.4 simulator mechanism assumption; no behavioral estimate is claimed.
  near_threshold_minimum_amount:
    value: 8000000
    unit: integer VND
    rationale: Lower bound for non-card-testing fraud amounts near the declared 10 million VND reference threshold.
    provenance:
      kind: assumption
      reference: P1.4 synthetic fraud amount band; no transaction amount distribution is claimed.
  near_threshold_maximum_amount:
    value: 12000000
    unit: integer VND
    rationale: Upper bound for non-card-testing fraud amounts near the declared 10 million VND reference threshold.
    provenance:
      kind: assumption
      reference: P1.4 synthetic fraud amount band; no transaction amount distribution is claimed.
  ato:
    campaign_interval_days:
      value: 30
      unit: local calendar days between ATO patterns
      rationale: Distributes a small number of synthetic takeover examples across base history and episode futures.
      provenance:
        kind: assumption
        reference: P1.4 simulator schedule assumption; no attack prevalence is claimed.
    start_offset_days:
      value: 10
      unit: local calendar days after the ATO campaign start
      rationale: Spreads takeover transactions across episode days instead of concentrating multiple mechanisms on one date.
      provenance:
        kind: assumption
        reference: P1.4 simulator schedule assumption; no attack prevalence is claimed.
    start_hour_local:
      value: 11
      unit: local wall-clock hour in Asia/Ho_Chi_Minh
      rationale: Fixed synthetic local start hour for takeover transactions.
      provenance:
        kind: assumption
        reference: P1.4 simulator schedule assumption; no time-of-day estimate is claimed.
    transaction_count:
      value: 2
      unit: transactions per ATO pattern
      rationale: Two near-threshold merchant payments expose a repeated device/session signature.
      provenance:
        kind: assumption
        reference: P1.4 simulator mechanism assumption; no attack-size estimate is claimed.
    transaction_spacing_days:
      value: 5
      unit: local calendar days between ATO pattern transactions
      rationale: Keeps repeated takeover spending observable while spreading synthetic volume over the episode.
      provenance:
        kind: assumption
        reference: P1.4 simulator schedule assumption; no attack prevalence is claimed.
    device_signature_probability:
      value: 0.85
      unit: probability in [0, 1]
      rationale: A synthetic takeover uses a previously unseen device token with this probability; signatures can be absent.
      provenance:
        kind: assumption
        reference: P1.4 probabilistic ATO signature assumption; no observed device-risk rate is claimed.
    approval_probability:
      value: 0.75
      unit: probability in [0, 1]
      rationale: Synthetic chance that an attempted takeover transaction is authorized.
      provenance:
        kind: assumption
        reference: P1.4 simulator mechanism assumption; not an issuer estimate.
    channel:
      value: wallet
      unit: channel code
      rationale: Represent ATO spending through the wallet channel without adding an operational mechanism field.
      provenance:
        kind: assumption
        reference: P1.4 simulator mechanism assumption; no channel prevalence is claimed.
  collusion:
    campaign_interval_days:
      value: 90
      unit: local calendar days between collusion patterns
      rationale: Sparse coordinated transfers in the pre-drift shared history.
      provenance:
        kind: assumption
        reference: P1.4 simulator schedule assumption; no collusion prevalence is claimed.
    start_hour_local:
      value: 13
      unit: local wall-clock hour in Asia/Ho_Chi_Minh
      rationale: Fixed synthetic local start hour for coordinated transfers.
      provenance:
        kind: assumption
        reference: P1.4 simulator schedule assumption; no time-of-day estimate is claimed.
    sender_count:
      value: 2
      unit: sender accounts per collusion pattern
      rationale: Two accounts contribute to a shared mule before the coordinated cash-out.
      provenance:
        kind: assumption
        reference: P1.4 simulator mechanism assumption; no group-size estimate is claimed.
    transfer_spacing_minutes:
      value: 5
      unit: minutes between incoming transfers
      rationale: Separates transfer event times so the chain has an unambiguous order.
      provenance:
        kind: assumption
        reference: P1.4 simulator mechanism assumption; no timing estimate is claimed.
    cashout_delay_minutes:
      value: 30
      unit: minutes after each incoming transfer
      rationale: Allows each incoming transfer to settle before its paired outbound transfer.
      provenance:
        kind: assumption
        reference: P1.4 simulator mechanism assumption; no timing estimate is claimed.
  social_engineering:
    campaign_interval_days:
      value: 45
      unit: local calendar days between social-engineering patterns
      rationale: Distributes receiving-account and cash-out examples across the shared history and episode futures.
      provenance:
        kind: assumption
        reference: P1.4 simulator schedule assumption; no attack prevalence is claimed.
    start_offset_days:
      value: 8
      unit: local calendar days after the episode or history start
      rationale: Leaves a complete seven-day account-history window before the mule's first receipt, while the account remains new under the 30-day recipient signal.
      provenance:
        kind: assumption
        reference: P1.4 recipient-signal observation-window assumption; no attack prevalence is claimed.
    new_account_warmup_days:
      value: 7
      unit: local calendar days before the first receipt
      rationale: Makes the mule account observable for the full seven-day history window before funds arrive.
      provenance:
        kind: contract
        reference: docs/data.md, section 1; docs/model.md, section 1.
    start_hour_local:
      value: 14
      unit: local wall-clock hour in Asia/Ho_Chi_Minh
      rationale: Fixed synthetic local start hour for victim transfers.
      provenance:
        kind: assumption
        reference: P1.4 simulator schedule assumption; no time-of-day estimate is claimed.
    fan_in_count:
      value: 5
      unit: distinct senders per recipient pattern
      rationale: Gives mule and legitimate household-business control recipients the same high fan-in support.
      provenance:
        kind: assumption
        reference: P1.4 synthetic control construction; not a population estimate.
    older_sender_minimum_count:
      value: 2
      unit: senders age band 55+ per social-engineering group
      rationale: Ensures an observable older-customer transfer share while keeping the same senders in the benign household-business control.
      provenance:
        kind: assumption
        reference: P1.4 social-engineering feature support; no victim-age prevalence is claimed.
    incoming_spacing_days:
      value: 1
      unit: local calendar days between incoming transfers
      rationale: Preserves a five-sender fan-in within seven days while distributing synthetic volume across dates.
      provenance:
        kind: assumption
        reference: P1.4 simulator schedule assumption; no attack prevalence is claimed.
    cashout_delay_minutes:
      value: 30
      unit: minutes after each incoming transfer
      rationale: Paired transfers leave the recipient after settlement and within the configured mule capability window.
      provenance:
        kind: assumption
        reference: P1.4 simulator mechanism assumption; no timing estimate is claimed.
    business_control_minimum_amount:
      value: 100000
      unit: integer VND
      rationale: Lower bound for benign household-business receipts in the fan-in control.
      provenance:
        kind: assumption
        reference: P1.4 benign control assumption; no business amount distribution is claimed.
    business_control_maximum_amount:
      value: 500000
      unit: integer VND
      rationale: Upper bound for benign household-business receipts in the fan-in control.
      provenance:
        kind: assumption
        reference: P1.4 benign control assumption; no business amount distribution is claimed.

label_reporting:
  maturity_horizon_days:
    value: 90
    unit: days
    rationale: MVP maturity policy horizon.
    provenance:
      kind: contract
      reference: docs/data.md, section 3.
  minimum_delay_days:
    value: 0
    unit: days after event
    rationale: Inclusive lower bound for the configured discrete uniform report-delay distribution.
    provenance:
      kind: assumption
      reference: Simulator label-delay assumption; no source-specific distribution is claimed.
  maximum_delay_days:
    value: 120
    unit: days after event
    rationale: Inclusive upper bound for the configured discrete uniform report-delay distribution; supports late reports beyond H.
    provenance:
      kind: assumption
      reference: Simulator label-delay assumption; no source-specific distribution is claimed.
  delay_distribution:
    value: uniform_integer
    unit: distribution code
    rationale: Use the same source-agnostic discrete uniform delay for each reported transaction label.
    provenance:
      kind: assumption
      reference: Simulator label-delay assumption; no source-specific distribution is claimed.
  probability_reported:
    value: 0.8
    unit: probability in [0, 1]
    rationale: Per-transaction chance of ever receiving a label conclusion; some true fraud therefore remains unreported.
    provenance:
      kind: assumption
      reference: Simulator label-reporting assumption; not an empirical estimate.

profiles:
  smoke:
    customer_count:
      value: 20
      unit: customers
      rationale: Small synthetic world for fast contract checks.
      provenance:
        kind: assumption
        reference: P1.1 smoke profile scale; no protocol values are changed.
    merchant_count:
      value: 5
      unit: merchants
      rationale: Small synthetic merchant set for fast contract checks.
      provenance:
        kind: assumption
        reference: P1.1 smoke profile scale; no protocol values are changed.
  pilot:
    customer_count:
      value: 1000
      unit: customers
      rationale: Initial pilot world size, subject to support checks at P1.8.
      provenance:
        kind: assumption
        reference: P1.1 pilot profile scale; no external population estimate is claimed.
    merchant_count:
      value: 100
      unit: merchants
      rationale: Initial pilot merchant count, subject to support checks at P1.8.
      provenance:
        kind: assumption
        reference: P1.1 pilot profile scale; no external population estimate is claimed.
